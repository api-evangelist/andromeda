name: Andromeda
description: 'Andromeda is a robotics company building personalised humanoid robot companions for
  aged care and assisted living. Its flagship robot, Abi, adapts to each resident''s personality,
  ability, and language to provide social connection, conversation, and engagement that improves
  resident mood and wellbeing while extending care-team capacity. Founded by Grace Brown and backed
  by Forerunner Ventures and Paradigm, Andromeda has deployed Abi across aged-care providers in
  Australia and the United States (partners include mecwacare and Medical & Aged Care Group) and has
  been featured by the BBC, CNN, Forbes, and ABC Australia. The company currently publishes a public
  marketing and news site but no developer platform, API, or public technical documentation.'
